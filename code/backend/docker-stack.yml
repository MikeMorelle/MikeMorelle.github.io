version: "3.9"

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3
    volumes:
      - seaweed-data:/data
    networks:
      - backend-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  seaweedfs-ui:
    image: nginx:1.27-alpine
    configs:
      - source: seaweed_nginx_conf
        target: /etc/nginx/conf.d/default.conf
    ports:
      - target: 8888
        published: 8888
        mode: ingress
    networks:
      - backend-net
    deploy:
      replicas: 1

  backend:
    image: cloud-backend:latest
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/backend
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: admin
    ports:
      - target: 8000
        published: 8000
        mode: ingress
    networks:
      - backend-net
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
      placement:
        max_replicas_per_node: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

networks:
  backend-net:
    driver: overlay

volumes:
  postgres-data:
  seaweed-data:

configs:
  seaweed_nginx_conf:
    file: ./seaweedfs-nginx.conf