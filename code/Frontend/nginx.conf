# ============================================
# NGINX CONFIGURATION FOR FRONTEND DASHBOARD
# This config serves the React app on port 80
# ============================================

server {
        # Listen on port 80 inside the container
    listen 80;

    # Accept requests for localhost
    server_name localhost;

    # Serve files from this folder
    root /usr/share/nginx/html;

    # Default file to show
    index index.html;

    # Compress files to load faster
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Send all requests to React (React handles routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}